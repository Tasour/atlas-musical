<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <title>Atlas Musical — choisir une musique</title>
  <link rel="stylesheet" href="/styles.css?v=19">
</head>
<body>
  <a class="skip-link" href="#view">Aller au contenu</a>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17.5V20h14v-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.6 2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8L12 3.6Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="M17 4.5 20 7.5l-3 3M7 19.5l-3-3 3-3M20 7.5H8a4 4 0 0 0-4 4v1M4 16.5h12a4 4 0 0 0 4-4v-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9.5h3l4-3v11l-4-3H4zM15 8.5a5 5 0 0 1 0 7M17.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 5.7M4 5v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v6M12 7.5v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2l1.5-5 2 10L11 7l2 12 2.5-9 2 5H21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M20 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M4 12h15m0 0-6-6m6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M4 8h6M14 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.1M4.5 12h.1M4.5 17h.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/groups" aria-label="Atlas Musical — accueil">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M5 24c4-1 5-8 9-8s5 12 9 12 5-16 9-16 4 8 7 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="31" cy="9" r="3" fill="currentColor"/></svg>
        </span>
        <span class="brand-text"><strong>Atlas Musical</strong><small>de 200 pistes à une décision</small></span>
      </a>

      <nav class="flow-nav" id="flowNav" aria-label="Étapes du parcours">
        <button type="button" data-nav="brief"><span>1</span> Brief</button>
        <button type="button" data-nav="groups"><span>2</span> Explorer</button>
        <button type="button" data-nav="group"><span>3</span> Affiner</button>
        <button type="button" data-nav="shortlist"><span>4</span> Short-list <b id="shortlistCount">0</b></button>
        <button type="button" data-nav="track"><span>5</span> Décider</button>
      </nav>

      <div class="top-actions">
        <button class="btn ghost small search-jump" type="button" id="globalSearchBtn"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg> Rechercher</button>
        <button class="btn ghost small" type="button" id="helpBtn"><svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg> Aide</button>
        <div class="menu-wrap">
          <button class="btn ghost small" type="button" id="menuBtn" aria-haspopup="menu" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg> Plus</button>
          <div class="menu" id="moreMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-format="json">Exporter la sélection (JSON)</button>
            <button type="button" role="menuitem" data-format="csv">Exporter la sélection (CSV)</button>
            <button type="button" role="menuitem" data-action="copy-credits">Copier les crédits</button>
            <hr>
            <button type="button" role="menuitem" data-action="methodology">Méthodologie</button>
            <button type="button" role="menuitem" data-action="credits">Crédits</button>
            <button type="button" role="menuitem" data-action="export-base-json">Télécharger la base JSON</button>
            <button type="button" role="menuitem" data-action="export-base-sqlite">Télécharger la base SQLite</button>
          </div>
        </div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
    <div class="sr-only" id="routeAnnouncer" aria-live="polite"></div>

    <footer class="player" id="player" aria-label="Lecteur audio">
      <div class="now">
        <div class="cover" aria-hidden="true"><svg class="icon"><use href="#i-wave"></use></svg></div>
        <div class="now-meta">
          <strong id="nowTitle">Aucune piste sélectionnée</strong>
          <span id="nowArtist">Choisissez une piste pour l’écouter</span>
        </div>
      </div>
      <button class="icon-btn play" id="playBtn" type="button" aria-label="Lecture" disabled><svg class="icon"><use href="#i-play"></use></svg></button>
      <div class="timeline">
        <span class="time" id="timeCurrent">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position de lecture">
        <span class="time" id="timeTotal">0:00</span>
      </div>
      <div class="player-actions">
        <span class="badge-preview" id="previewBadge" hidden>extrait 12 s</span>
        <button class="icon-btn" id="loopBtn" type="button" aria-label="Boucler" aria-pressed="false"><svg class="icon"><use href="#i-loop"></use></svg></button>
        <button class="icon-btn" id="downloadBtn" type="button" aria-label="Télécharger le MP3" disabled><svg class="icon"><use href="#i-download"></use></svg></button>
        <button class="icon-btn" id="shortlistBtn" type="button" aria-label="Ajouter à la short-list" disabled><svg class="icon"><use href="#i-star"></use></svg></button>
        <label class="volume" title="Volume"><svg class="icon" aria-hidden="true"><use href="#i-volume"></use></svg><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="dialog" id="appDialog">
    <div class="dialog-head">
      <h2 id="dialogTitle">À propos</h2>
      <button class="icon-btn" type="button" id="dialogClose" aria-label="Fermer"><svg class="icon"><use href="#i-close"></use></svg></button>
    </div>
    <div class="dialog-body" id="dialogBody"></div>
  </dialog>

  <audio id="audio" preload="metadata"></audio>
  <audio id="abA" preload="metadata"></audio>
  <audio id="abB" preload="metadata"></audio>
  <script type="module" src="/app.js?v=19"></script>
</body>
</html>
