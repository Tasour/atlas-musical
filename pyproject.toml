[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-musical"
version = "1.1.0"
description = "Carte affective locale pour explorer une bibliothèque de musiques instrumentales."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Vincent Tassier" },
]
keywords = ["music", "mir", "librosa", "fastapi", "data-visualization", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/Tasour/atlas-musical"
Repository = "https://github.com/Tasour/atlas-musical"
Issues = "https://github.com/Tasour/atlas-musical/issues"

[project.optional-dependencies]
analysis = [
  "librosa>=1.0,<2",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.12,<1",
]
download = [
  "yt-dlp>=2025.1,<2027",
]
dev = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
